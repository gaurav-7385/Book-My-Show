services:
  postgres:
    image: postgres:16-alpine
    container_name: showspot-postgres
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bookmyshow
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: showspot-redis
    ports:
      - "6380:6379"

volumes:
  pgdata:
